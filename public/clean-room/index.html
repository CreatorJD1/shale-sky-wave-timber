<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean room</title>
<style>
  :root {
    --bg: #efeae2;
    --paper: #f7f4ee;
    --ink: #1c1915;
    --muted: #6d655c;
    --line: #ddd4c8;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header { padding: 16px 18px 8px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 28px; margin: 0; letter-spacing: -0.03em; }
  .sub { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  button {
    font: inherit;
    color: inherit;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    min-height: 44px;
    padding: 0 14px;
    flex: 0 0 auto;
  }
  button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  section[hidden] { display: none; }
  h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 20px; margin: 22px 12px 0; }
  figure { margin: 0; padding: 10px 0 18px; }
  figcaption { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; padding: 0 12px; }
  .scroller { overflow: hidden; }
  img, canvas.loop {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
  }
  canvas.loop { background: #00f; }
  #modes { margin-top: 8px; }
  #stage-wrap { padding-bottom: 12px; }
  #stage-wrap[hidden] { display: none; }
  #stage {
    display: block;
    width: 100%;
    height: auto;
    background-color: #d8d2c8;
    background-image:
      linear-gradient(45deg, #cfc8bc 25%, transparent 25%),
      linear-gradient(-45deg, #cfc8bc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cfc8bc 75%),
      linear-gradient(-45deg, transparent 75%, #cfc8bc 75%);
    background-size: 28px 28px;
    background-position: 0 0, 0 14px, 14px -14px, -14px 0;
  }
  .transport { display: flex; gap: 8px; align-items: center; padding: 8px 12px 0; }
  #clipmeta { color: var(--muted); font-size: 13px; }
  #clips { padding: 8px 12px 0; }
</style>
</head>
<body>
<header>
  <h1>Clean room</h1>
  <div class="row" id="modes">
    <button type="button" id="mode-play" class="on">Animate</button>
    <button type="button" id="mode-stills">Stills</button>
  </div>
  <p class="sub" id="count"></p>
  <div class="row" id="tabs" role="tablist"></div>
</header>
<div id="stage-wrap">
    <canvas id="stage" width="720" height="1040"></canvas>
    <div class="transport">
      <button type="button" id="playbtn">Pause</button>
      <button type="button" id="replaybtn">Replay</button>
      <span id="clipmeta"></span>
    </div>
    <div class="row" id="clips"></div>
</div>
<main id="gallery"></main>

const tabs = document.getElementById("tabs");

const count = document.getElementById("count");

const stillBtns = [];

for (const [group, items] of GROUPS) {
  const section = document.createElement("section");
  section.dataset.tab = group;
  section.hidden = true;
  const h = document.createElement("h2");
  h.textContent = group;
  section.append(h);
  for (const item of items) {
    const [id, label, src, frames, fps] = item;
    const fig = document.createElement("figure");
    fig.id = id;
    const cap = document.createElement("figcaption");
    cap.textContent = label;
    fig.append(cap);
    const scroller = document.createElement("div");
    scroller.className = "scroller";
    if (frames) {
      const canvas = document.createElement("canvas");
      canvas.className = "loop";
      canvas.dataset.src = src;
      canvas.dataset.frames = frames;
      canvas.dataset.fps = fps || 6;
      scroller.append(canvas);
    } else {
      const img = document.createElement("img");
      img.alt = label;
      img.dataset.src = src;
      scroller.append(img);
    }
    fig.append(scroller);
    section.append(fig);
  }
  gallery.append(section);
  sections.set(group, section);

  const b = document.createElement("button");
  b.type = "button";
  b.dataset.tab = group;
  b.textContent = group;
  b.addEventListener("click", () => show(group));
  stillBtns.push(b);
}

function load(section) {
  section.querySelectorAll("img[data-src]").forEach((img) => {
    img.src = img.dataset.src;
    img.removeAttribute("data-src");
  });
  section.querySelectorAll("canvas[data-src]").forEach((canvas) => {
    const frames = Number(canvas.dataset.frames);
    const fps = Number(canvas.dataset.fps);
    const img = new Image();
    img.onload = () => {
      const cw = Math.floor(img.width / frames);
      const ch = img.height;
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext("2d");
      let i = 0;
      const draw = () => {
        ctx.drawImage(img, i * cw, 0, cw, ch, 0, 0, cw, ch);
        i = (i + 1) % frames;
      };
      draw();
      setInterval(draw, 1000 / fps);
    };
    img.src = canvas.dataset.src;
    canvas.removeAttribute("data-src");
  });
}

function show(name) {
  if (!sections.has(name)) name = GROUPS[0][0];
  for (const [group, section] of sections) {
    const on = group === name;
    section.hidden = !on;
    if (on) load(section);
  }
  for (const b of stillBtns) b.classList.toggle("on", b.dataset.tab === name);
  const n = sections.get(name).querySelectorAll("figure").length;
  count.textContent = n + (n === 1 ? " pose" : " poses");
}

const stage = document.getElementById("stage");
const ctx = stage.getContext("2d", { willReadFrequently: true });
const video = document.createElement("video");
video.muted = true;
video.defaultMuted = true;
video.playsInline = true;
video.setAttribute("playsinline", "");
video.preload = "auto";
const clipRow = document.getElementById("clips");
const meta = document.getElementById("clipmeta");
const playbtn = document.getElementById("playbtn");
const replaybtn = document.getElementById("replaybtn");
let kind = "loop";
let current = VIDEOS[0];
let playing = true;

function keyFrame() {
  if (video.readyState < 2 || !video.videoWidth) return;
  if (stage.width !== video.videoWidth || stage.height !== video.videoHeight) {
    stage.width = video.videoWidth;
    stage.height = video.videoHeight;
  }
  ctx.drawImage(video, 0, 0, stage.width, stage.height);
  const frame = ctx.getImageData(0, 0, stage.width, stage.height);
  const p = frame.data;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const d = b - Math.max(r, g);
    if (b > 130 && d > 18) p[i + 3] = d > 60 ? 0 : Math.max(0, 255 - d * 5);
  }
  ctx.putImageData(frame, 0, 0);
}

function tick() {
  if (!document.getElementById("stage-wrap").hidden) keyFrame();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function playClip(clip) {
  current = clip;
  video.loop = clip.kind !== "action";
  video.src = clip.src;
  video.currentTime = 0;
  playing = true;
  playbtn.textContent = "Pause";
  const go = video.play();
  if (go) go.catch(() => { playing = false; playbtn.textContent = "Play"; });
  meta.textContent = clip.name + " · " + clip.kind + " · " + clip.length + " · silent";
  for (const b of clipRow.children) b.classList.toggle("on", b.dataset.id === clip.id);
  count.textContent = VIDEOS.filter((v) => v.kind === kind).length + " videos";
}

function showKind(next) {
  kind = next;
  for (const b of tabs.children) b.classList.toggle("on", b.dataset.kind === next);
  clipRow.replaceChildren();
  const list = VIDEOS.filter((v) => v.kind === next);
  for (const clip of list) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.id = clip.id;
    b.textContent = clip.name;
    b.addEventListener("click", () => playClip(clip));
    clipRow.append(b);
  }
  playClip(list[0]);
}

function setMode(next) {
  const animate = next === "play";
  document.getElementById("mode-play").classList.toggle("on", animate);
  document.getElementById("mode-stills").classList.toggle("on", !animate);
  document.getElementById("stage-wrap").hidden = !animate;
  gallery.hidden = animate;
  clipRow.hidden = !animate;
  document.querySelector(".transport").hidden = !animate;
  tabs.replaceChildren();
  if (animate) {
    for (const k of ["loop", "action", "talk"]) {
      const b = document.createElement("button");
      b.type = "button";
      b.dataset.kind = k;
      b.textContent = k === "loop" ? "Loops" : k === "action" ? "Actions" : "Talk";
      b.addEventListener("click", () => showKind(k));
      tabs.append(b);
    }
    showKind(kind);
  } else {
    video.pause();
    for (const b of stillBtns) tabs.append(b);
    show(stillBtns.find((b) => b.classList.contains("on"))?.dataset.tab || GROUPS[0][0]);
  }
}

playbtn.addEventListener("click", () => {
  if (video.paused) {
    video.play();
    playing = true;
    playbtn.textContent = "Pause";
  } else {
    video.pause();
    playing = false;
    playbtn.textContent = "Play";
  }
});
replaybtn.addEventListener("click", () => {
  video.currentTime = 0;
  video.play();
  playbtn.textContent = "Pause";
});
video.addEventListener("ended", () => {
  if (!video.loop) playbtn.textContent = "Play";
});
document.getElementById("mode-play").addEventListener("click", () => setMode("play"));
document.getElementById("mode-stills").addEventListener("click", () => setMode("stills"));
