<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean room</title>
<style>
  :root {
    --bg: #efeae2;
    --paper: #f7f4ee;
    --ink: #1c1915;
    --muted: #6d655c;
    --line: #ddd4c8;
    --mark: #9a3412;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { min-height: 100dvh; }
  button, input { font: inherit; color: inherit; }
  button {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    min-height: 44px;
    padding: 0 14px;
    cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  .app { min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 16px 18px 8px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 28px; margin: 0; letter-spacing: -0.03em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .stage-wrap { display: grid; place-items: center; min-height: 0; padding: 8px; }
  .stage { width: min(100%, 520px); height: min(58dvh, 720px); display: grid; place-items: center; }
  canvas { max-width: 100%; max-height: 100%; }
  .panel {
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    max-height: 46dvh;
    overflow: auto;
  }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 8px 0; }
  .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .slide { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { flex: 1; min-height: 44px; }
  .read { font-variant-numeric: tabular-nums; color: var(--mark); font-size: 13px; min-width: 3ch; }
  @media (min-width: 900px) {
    .app { grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; }
    header { grid-column: 1 / -1; }
    .stage { height: calc(100dvh - 92px); width: 100%; }
    .panel { border-top: 0; border-left: 1px solid var(--line); max-height: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Clean room</h1>
    <p class="sub">Flat base model. Face rig only. No suit, no shadows, no old driver.</p>
  </header>
  <div class="stage-wrap"><div class="stage" id="stage"><canvas id="view"></canvas></div></div>
  <aside class="panel">
    <div class="label">Bind</div>
    <div class="row" id="poses"></div>
    <div class="label">Blink</div>
    <div class="slide">
      <input id="blink" type="range" min="0" max="100" value="0" aria-label="Blink">
      <span class="read" id="blink-read">0</span>
      <button type="button" id="blink-test" aria-pressed="false">Test</button>
    </div>
    <div class="label">Gaze</div>
    <div class="row" id="gazes"></div>
    <div class="label">Mouth</div>
    <div class="row" id="mouths"></div>
  </aside>
</div>
<script>
const SKIN = "#be8957";
const POSES = {
  apose: {
    label: "A-pose",
    src: "apose.png",
    eyes: [
      { x: 0.468, y: 0.133, iris: "#e2a040" },
      { x: 0.532, y: 0.133, iris: "#3ea04a" },
    ],
    mouth: { x: 0.5, y: 0.164 },
  },
  tpose: {
    label: "T-pose",
    src: "tpose.png",
    eyes: [
      { x: 0.47, y: 0.17, iris: "#e2a040" },
      { x: 0.52, y: 0.17, iris: "#3ea04a" },
    ],
    mouth: { x: 0.5, y: 0.196 },
  },
};
const GAZES = [
  { id: "center", label: "Center", x: 0, y: 0 },
  { id: "left", label: "Left", x: -1, y: 0 },
  { id: "right", label: "Right", x: 1, y: 0 },
  { id: "up", label: "Up", x: 0, y: -1 },
  { id: "down", label: "Down", x: 0, y: 1 },
];
const MOUTHS = ["off", "rest", "AA", "EE", "OH", "M", "smile"];

const state = { pose: "apose", blink: 0, gaze: "center", mouth: "off" };
const images = {};
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
let blinkTest = false;
let raf = 0;

function load(id) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { images[id] = img; resolve(); };
    img.src = POSES[id].src;
  });
}

function row(el, items, current, onPick) {
  el.replaceChildren();
  for (const item of items) {
    const id = typeof item === "string" ? item : item.id;
    const label = typeof item === "string" ? item : item.label;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(id === current));
    b.addEventListener("click", () => onPick(id));
    el.append(b);
  }
}

function paintRows() {
  row(document.getElementById("poses"), Object.entries(POSES).map(([id, p]) => ({ id, label: p.label })), state.pose, (id) => { state.pose = id; paintRows(); draw(); });
  row(document.getElementById("gazes"), GAZES, state.gaze, (id) => { state.gaze = id; paintRows(); draw(); });
  row(document.getElementById("mouths"), MOUTHS, state.mouth, (id) => { state.mouth = id; paintRows(); draw(); });
}

function eye(pose, e, gaze, blink) {
  const img = images[state.pose];
  const x = e.x * img.width;
  const y = e.y * img.height;
  const rx = img.width * 0.011;
  const ry = img.height * 0.0065;
  ctx.fillStyle = SKIN;
  ctx.beginPath();
  ctx.ellipse(x, y, rx * 1.15, ry * 1.25, 0, 0, Math.PI * 2);
  ctx.fill();
  const open = Math.max(0.06, 1 - blink);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, open);
  ctx.fillStyle = "#f3efe6";
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = e.iris;
  ctx.beginPath();
  ctx.arc(gaze.x * rx * 0.35, gaze.y * ry * 0.35, rx * 0.46, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1a120c";
  ctx.beginPath();
  ctx.arc(gaze.x * rx * 0.35, gaze.y * ry * 0.35, rx * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "#1c1915";
  ctx.lineWidth = Math.max(2, rx * 0.12);
  ctx.beginPath();
  ctx.ellipse(x, y, rx * 1.15, ry * open, 0, Math.PI, Math.PI * 2);
  ctx.stroke();
}

function mouthDraw(pose) {
  const img = images[state.pose];
  const x = pose.mouth.x * img.width;
  const y = pose.mouth.y * img.height;
  const rx = img.width * 0.014;
  const ry = img.height * 0.005;
  ctx.fillStyle = SKIN;
  ctx.beginPath();
  ctx.ellipse(x, y, rx * 1.15, ry * 1.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#3a241c";
  ctx.strokeStyle = "#3a241c";
  ctx.lineWidth = Math.max(2, rx * 0.16);
  const m = state.mouth;
  ctx.beginPath();
  if (m === "AA") ctx.ellipse(x, y, rx * 0.7, ry * 1.5, 0, 0, Math.PI * 2);
  else if (m === "EE") ctx.ellipse(x, y, rx, ry * 0.55, 0, 0, Math.PI * 2);
  else if (m === "OH") ctx.ellipse(x, y, rx * 0.55, ry * 1.15, 0, 0, Math.PI * 2);
  else if (m === "smile") ctx.arc(x, y - ry * 0.2, rx * 0.85, 0.15 * Math.PI, 0.85 * Math.PI);
  else ctx.moveTo(x - rx, y), ctx.lineTo(x + rx, y);
  if (m === "smile" || m === "rest" || m === "M") ctx.stroke();
  else ctx.fill();
}

function draw() {
  const img = images[state.pose];
  if (!img) return;
  const stage = document.getElementById("stage").getBoundingClientRect();
  const scale = Math.min(stage.width / img.width, stage.height / img.height);
  canvas.width = img.width;
  canvas.height = img.height;
  canvas.style.width = Math.floor(img.width * scale) + "px";
  canvas.style.height = Math.floor(img.height * scale) + "px";
  ctx.clearRect(0, 0, img.width, img.height);
  ctx.drawImage(img, 0, 0);
  const pose = POSES[state.pose];
  const gaze = GAZES.find((g) => g.id === state.gaze);
  if (state.blink > 0.02 || state.gaze !== "center") {
    for (const e of pose.eyes) eye(pose, e, gaze, state.blink);
  }
  if (state.mouth !== "off") mouthDraw(pose);
}

document.getElementById("blink").addEventListener("input", (ev) => {
  state.blink = Number(ev.target.value) / 100;
  document.getElementById("blink-read").textContent = String(ev.target.value);
  draw();
});

document.getElementById("blink-test").addEventListener("click", (ev) => {
  blinkTest = !blinkTest;
  ev.currentTarget.setAttribute("aria-pressed", String(blinkTest));
  cancelAnimationFrame(raf);
  if (!blinkTest) return;
  const loop = (now) => {
    const o = (Math.sin(now / 280) + 1) / 2;
    const closed = o > 0.82 ? (o - 0.82) / 0.18 : 0;
    state.blink = closed;
    document.getElementById("blink").value = String(Math.round(closed * 100));
    document.getElementById("blink-read").textContent = String(Math.round(closed * 100));
    draw();
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
});

window.addEventListener("resize", draw);
paintRows();
Promise.all([load("apose"), load("tpose")]).then(draw);

window.cleanRoom = {
  setPose(id) { state.pose = id; paintRows(); draw(); },
  setBlink(v) { state.blink = v; document.getElementById("blink").value = String(Math.round(v * 100)); draw(); },
  setGaze(id) { state.gaze = id; paintRows(); draw(); },
  setMouth(id) { state.mouth = id; paintRows(); draw(); },
  state: () => ({ ...state }),
};
</script>
</body>
</html>
